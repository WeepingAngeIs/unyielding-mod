name: Pink Corvisquire cloud checks
on:
  push:
    branches: [main, 'codex/pink-corvisquire-cloud']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build_and_validate.py
      - run: node tools/test_player_ability.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/cloud_preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mawonna-Pink-Corvisquire
          path: dist/
          if-no-files-found: error

