name: V17 pack build and cloud checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: v17-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate-build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build_and_validate.py
      - run: node tools/test_player_ability.cjs
      - run: npm install --no-save playwright@1.56.1
      # GitHub's Ubuntu image already includes Chrome and its system libraries.
      - run: google-chrome --version
      - run: node tools/cloud_sliggoo_preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Mawonna-v17-Corvislight-INSTALL
          path: dist/installable/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mawonna-complete-zip
          path: dist/Mawonna.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mawonna-v17-test-reports
          path: |
            dist/*.json
            dist/previews/
          if-no-files-found: error
  runtime-spawn-smoke:
    needs: validate-build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: Mawonna-v17-Corvislight-INSTALL
          path: runtime-pack
      - name: Boot real Cobblemon and test all spawn commands
        run: >-
          python tools/cloud_runtime_smoke.py
          --pack runtime-pack
          --eula-file source/runtime/eula.txt
          --species Covislight mawonna mawonna_flower mawileunyielding fairy_sliggoo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mawonna-v17-RUNTIME-TEST-REPORT
          path: dist/runtime/
          if-no-files-found: warn
  client-load-smoke:
    needs: validate-build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - uses: actions/download-artifact@v4
        with:
          name: Mawonna-v17-Corvislight-INSTALL
          path: client-pack
      - name: Load and reload pack in real Minecraft client
        run: python tools/cloud_client_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mawonna-v17-CLIENT-TEST-REPORT
          path: dist/client/
          if-no-files-found: warn

  publish-tested-pack:
    needs: [validate-build-preview, runtime-spawn-smoke, client-load-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mawonna-complete-zip
          path: tested-pack
      - name: Publish only the tested complete pack
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          cp tested-pack/Mawonna.zip Mawonna.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mawonna.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish cloud-tested Mawonna pack with Fairy Sliggoo [skip ci]"
          git push origin HEAD:main
